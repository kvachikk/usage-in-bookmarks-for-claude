name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package

      # web-ext names both builds after the manifest, so they collide in the
      # flat namespace of a release's assets. Name them after the target.
      - name: Name the builds by target
        run: |
          cd artifacts
          for target in chrome firefox; do
            for zip in "$target"/*.zip; do
              mv "$zip" "${zip%.zip}-$target.zip"
            done
          done

      # Published so anyone can rebuild and compare against the store builds.
      - name: Checksum
        run: |
          cd artifacts
          sha256sum ./chrome/*.zip ./firefox/*.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/chrome/*.zip
            artifacts/firefox/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
