name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Privacy check
        run: npm run lint:privacy

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "**/*.{js,mjs,json,md,css,html}"

      - name: Unit tests
        run: npm test

      - name: Build both targets
        run: npm run build

      - name: Validate extension
        run: npx web-ext lint -s dist/firefox

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: usage-in-bookmarks-for-claude-chrome
          path: artifacts/chrome/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: usage-in-bookmarks-for-claude-firefox
          path: artifacts/firefox/*.zip

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
